{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniMart | Checkout</title>

    <link rel="stylesheet"
          href="{% static 'shop/css/style.css' %}">
</head>

<body>

    <style>
        /* =========================
   CHECKOUT PAGE
   ========================= */

.checkout-section {
    max-width: 650px;
    margin: 0 auto;
    background: #ffffff;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}

.checkout-section h2 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 30px;
    color: #111827;
}


/* Form */
.checkout-section form {
    display: flex;
    flex-direction: column;
}


/* Labels */
.checkout-section label {
    margin-bottom: 8px;
    margin-top: 16px;
    font-size: 15px;
    font-weight: 600;
    color: #374151;
}

.checkout-section label:first-child {
    margin-top: 0;
}


/* Inputs & Textarea */
.checkout-section input,
.checkout-section textarea {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #f9fafb;
    transition: 0.3s;
}


/* Input Focus */
.checkout-section input:focus,
.checkout-section textarea:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}


/* Placeholder */
.checkout-section input::placeholder,
.checkout-section textarea::placeholder {
    color: #9ca3af;
}


/* Address */
.checkout-section textarea {
    min-height: 110px;
    resize: vertical;
}


/* Total Amount */
.checkout-section h3 {
    margin-top: 28px;
    padding: 18px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    text-align: center;
    font-size: 21px;
    color: #15803d;
}


/* Place Order Button */
.checkout-section button {
    width: 100%;
    margin-top: 20px;
    padding: 14px 20px;
    border: none;
    border-radius: 9px;
    background: #16a34a;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}


.checkout-section button:hover {
    background: #15803d;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(22, 163, 74, 0.25);
}


.checkout-section button:active {
    transform: translateY(0);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 650px) {

    main {
        width: 94%;
        margin: 25px auto;
    }

    .checkout-section {
        padding: 22px;
        border-radius: 14px;
    }

    .checkout-section h2 {
        font-size: 25px;
        margin-bottom: 25px;
    }

    .checkout-section input,
    .checkout-section textarea {
        padding: 12px;
        font-size: 14px;
    }

    .checkout-section h3 {
        font-size: 18px;
        padding: 15px;
    }

    .checkout-section button {
        font-size: 16px;
        padding: 13px;
    }
}
    </style>


<header>
    <h1>🛒 MiniMart</h1>

    <nav>
        <a href="/">Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
    </nav>
</header>


<main>

    <section class="checkout-section">

        <h2>Checkout</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <label>Mobile Number</label>
            <input type="tel"
                   name="mobile"
                   placeholder="Enter mobile number"
                   required>

            <label>Address</label>
            <textarea name="address"
                      placeholder="Enter your address"
                      required></textarea>

            <label>City</label>
            <input type="text"
                   name="city"
                   placeholder="Enter city"
                   required>

            <label>Pincode</label>
            <input type="text"
                   name="pincode"
                   placeholder="Enter pincode"
                   required>

            <h3>Total Amount: ₹{{ total }}</h3>

            <button type="submit">
                Place Order
            </button>

        </form>

    </section>

</main>


<footer>
    <p>© 2026 MiniMart. All rights reserved.</p>
</footer>

</body>
</html>
